name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: read
  id-token: write # OIDC exchange for npm trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # A version PR opened with GITHUB_TOKEN parks its pull_request checks
      # until a person approves them; one opened by the app runs them.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24 # matches engines.node ">=24"

      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: changesets
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          github-token: ${{ steps.app-token.outputs.token }}

      # changesets derives "published" from the publish command's exit code
      # and never asks the registry, so the tags and the GitHub release can
      # outlive a publish that never landed. The deadline covers the whole set
      # rather than each package in turn: a per-package window multiplies by the
      # number of packages released, and the registry's indexing lag is one lag
      # for the release, not one per name.
      - name: Verify the published versions reached the registry
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED: ${{ steps.changesets.outputs.published-packages }}
        run: |
          set -euo pipefail
          pending=$(echo "$PUBLISHED" | jq -r '.[] | "\(.name)@\(.version)"')
          deadline=$((SECONDS + 900))
          while :; do
            missing=""
            for spec in $pending; do
              npm view "$spec" version --prefer-online >/dev/null 2>&1 || missing="$missing $spec"
            done
            pending="$missing"
            [ -n "$pending" ] || break
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::changesets reported a successful publish but after 15 minutes the registry has no:$pending"
              exit 1
            fi
            sleep 30
          done
