name: Lint
on:
  pull_request:
  # Dispatched by release.yml for the changeset-release/main PR, whose
  # pull_request runs are parked unexecuted behind an approval gate.
  workflow_dispatch:
  schedule:
    - cron: 31 4 * * 1
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Plan validation
        id: plan
        run: node .github/ci/ci.mjs plan lint
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          cache: true
      # oxlint.config.ts imports this package through its own exports, which
      # resolve to dist.
      - run: pnpm build
      - name: Check formatting
        run: node .github/ci/ci.mjs run lint -- pnpm format:check
      - name: Check dead code
        if: ${{ !cancelled() }}
        run: node .github/ci/ci.mjs run lint -- pnpm fallow:dead
      - if: ${{ !cancelled() }}
        run: pnpm check:generated
      - if: ${{ !cancelled() }}
        run: pnpm check:readme
      - if: ${{ !cancelled() }}
        run: node .github/ci/ci.mjs run lint -- pnpm oxlint --format=github .
      - name: Audit dependencies
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: node .github/ci/ci.mjs run lint -- pnpm audit --audit-level=high
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        name: Upload CI evidence
        if: ${{ !cancelled() }}
        with:
          name: ci-execution-${{ github.workflow }}-${{ github.job }}-${{ github.run_attempt }}
          path: .ci-results/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
