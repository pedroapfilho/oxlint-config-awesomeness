name: Lint
on:
  pull_request:
  # Dispatched by release.yml for the changeset-release/main PR, whose
  # pull_request runs are parked unexecuted behind an approval gate.
  workflow_dispatch:
  schedule:
    - cron: 31 4 * * 1
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Plan validation
        id: plan
        run: node .github/ci/ci.mjs plan lint
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          cache: true
      # oxlint.config.ts imports this package through its own exports, which
      # resolve to dist.
      - run: pnpm build
      - name: Check formatting
        run: node .github/ci/ci.mjs run lint -- pnpm format:check
      - name: Check dead code
        if: ${{ !cancelled() }}
        run: node .github/ci/ci.mjs run lint -- pnpm fallow:dead
      - name: Audit changed code
        if: ${{ !cancelled() }}
        run: node .github/ci/ci.mjs run lint -- pnpm fallow:audit
      - if: ${{ !cancelled() }}
        run: pnpm check:generated
      - if: ${{ !cancelled() }}
        run: pnpm check:readme
      - if: ${{ !cancelled() }}
        run: node .github/ci/ci.mjs run lint -- pnpm oxlint --format=github .
      - name: Install gitleaks
        if: ${{ !cancelled() }}
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfLo "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan git history for secrets
        if: ${{ !cancelled() }}
        run: node .github/ci/ci.mjs run lint -- gitleaks git --redact --verbose --exit-code 1
      - name: Install zizmor
        if: ${{ !cancelled() }}
        env:
          ZIZMOR_VERSION: 1.31.1
          ZIZMOR_SHA256: d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99
        run: |
          curl -sSfLo "$RUNNER_TEMP/zizmor.tar.gz" "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  $RUNNER_TEMP/zizmor.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/zizmor.tar.gz" -C /usr/local/bin zizmor
          zizmor --version
      - name: Audit workflows
        if: ${{ !cancelled() }}
        run: node .github/ci/ci.mjs run lint -- zizmor --offline --format github .github
      - name: Audit dependencies
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: node .github/ci/ci.mjs run lint -- pnpm audit --audit-level=high
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        name: Upload CI evidence
        if: ${{ !cancelled() }}
        with:
          name: ci-execution-${{ github.workflow }}-${{ github.job }}-${{ github.run_attempt }}
          path: .ci-results/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
