overrides:
  # Security: force patched transitive releases to clear pnpm audit advisories.
  # Each pin is the lowest release that carries the fix.
  "brace-expansion@>=1.0.0 <1.1.21": "^1.1.21"
  "brace-expansion@>=5.0.0 <5.0.12": "^5.0.12"
  js-yaml: "^4.3.2"

peerDependencyRules:
  allowedVersions:
    # typescript-eslint caps TypeScript at <6.1.0 and has no release that allows
    # 7 yet. It arrives transitively via eslint-plugin-perfectionist, and this
    # config requires TypeScript 7, so the range can never be satisfied.
    "@typescript-eslint/project-service>typescript": "7"
    "@typescript-eslint/tsconfig-utils>typescript": "7"
    "@typescript-eslint/typescript-estree>typescript": "7"
    "@typescript-eslint/utils>typescript": "7"

minimumReleaseAge: 180

# pnpm's release-age gate would otherwise block installing a fleet package the
# moment it is published.
minimumReleaseAgeExclude:
  - "@dashfoo/*"
  - "@easeia/*"
  - "@usebutr/*"
  - "@walletwright/*"
  - astro-awesomeness
