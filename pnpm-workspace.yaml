peerDependencyRules:
  allowedVersions:
    # typescript-eslint caps TypeScript at <6.1.0 and has no release that allows
    # 7 yet. It arrives transitively via eslint-plugin-perfectionist, and this
    # config requires TypeScript 7, so the range can never be satisfied.
    "@typescript-eslint/project-service>typescript": "7"
    "@typescript-eslint/tsconfig-utils>typescript": "7"
    "@typescript-eslint/typescript-estree>typescript": "7"
    "@typescript-eslint/utils>typescript": "7"

# Temporary: oxlint 1.79.0 published 2026-08-18T15:10Z, inside pnpm's 24h
# minimumReleaseAge quarantine, and CI cannot install without these. Delete this
# block (not the file) after 2026-08-19T15:10Z, then re-run `pnpm install`.
minimumReleaseAgeExclude:
  - "@oxlint/binding-android-arm-eabi@1.79.0"
  - "@oxlint/binding-android-arm64@1.79.0"
  - "@oxlint/binding-darwin-arm64@1.79.0"
  - "@oxlint/binding-darwin-x64@1.79.0"
  - "@oxlint/binding-freebsd-x64@1.79.0"
  - "@oxlint/binding-linux-arm-gnueabihf@1.79.0"
  - "@oxlint/binding-linux-arm-musleabihf@1.79.0"
  - "@oxlint/binding-linux-arm64-gnu@1.79.0"
  - "@oxlint/binding-linux-arm64-musl@1.79.0"
  - "@oxlint/binding-linux-ppc64-gnu@1.79.0"
  - "@oxlint/binding-linux-riscv64-gnu@1.79.0"
  - "@oxlint/binding-linux-riscv64-musl@1.79.0"
  - "@oxlint/binding-linux-s390x-gnu@1.79.0"
  - "@oxlint/binding-linux-x64-gnu@1.79.0"
  - "@oxlint/binding-linux-x64-musl@1.79.0"
